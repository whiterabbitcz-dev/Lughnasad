<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="celtic-gold" x="0" y="0" width="300" height="110" patternUnits="userSpaceOnUse">
      <!-- Base watercolor wash (peach visible through) -->
      <rect width="300" height="110" fill="#D4A017" opacity="0.88"/>
      <rect width="300" height="110" fill="#E8C662" opacity="0.15"/>

      <!-- Subtle peach tint showing "paper through gold" -->
      <ellipse cx="60" cy="40" rx="40" ry="20" fill="#F7D7B4" opacity="0.18"/>
      <ellipse cx="220" cy="70" rx="55" ry="22" fill="#F7D7B4" opacity="0.15"/>

      <!-- Main flowing Celtic knotwork -->
      <g fill="none" stroke="#8B6F1C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- Main S-curve spine -->
        <path d="M0,55 C30,20 60,90 90,55 C120,20 150,90 180,55 C210,20 240,90 270,55 L300,55"/>
        <path d="M0,75 C40,40 80,70 120,50 C160,70 200,40 240,60 L300,75"/>

        <!-- Volute triskele spirals -->
        <path d="M45,55 m-12,0 a12,12 0 1,1 24,0 a8,8 0 1,1 -16,0 a4,4 0 1,1 8,0"/>
        <path d="M150,55 m-12,0 a12,12 0 1,1 24,0 a8,8 0 1,1 -16,0 a4,4 0 1,1 8,0"/>
        <path d="M255,55 m-12,0 a12,12 0 1,1 24,0 a8,8 0 1,1 -16,0 a4,4 0 1,1 8,0"/>

        <!-- Interlocking loops (upper row) -->
        <path d="M20,30 Q35,10 50,30 Q65,50 80,30"/>
        <path d="M125,30 Q140,10 155,30 Q170,50 185,30"/>
        <path d="M230,30 Q245,10 260,30 Q275,50 290,30"/>

        <!-- Flowing connectors (lower row) -->
        <path d="M10,85 Q30,75 50,85 T90,85"/>
        <path d="M110,85 Q130,75 150,85 T190,85"/>
        <path d="M210,85 Q230,75 250,85 T290,85"/>

        <!-- Small accent loops -->
        <circle cx="75" cy="40" r="3" fill="#8B6F1C"/>
        <circle cx="180" cy="40" r="3" fill="#8B6F1C"/>
        <circle cx="285" cy="40" r="3" fill="#8B6F1C"/>
        <circle cx="25" cy="70" r="2.5" fill="#8B6F1C"/>
        <circle cx="125" cy="70" r="2.5" fill="#8B6F1C"/>
        <circle cx="225" cy="70" r="2.5" fill="#8B6F1C"/>
      </g>

      <!-- Lighter gold highlights for depth -->
      <g fill="none" stroke="#E8C662" stroke-width="0.8" opacity="0.7">
        <path d="M0,58 C30,23 60,93 90,58 C120,23 150,93 180,58 C210,23 240,93 270,58 L300,58"/>
        <path d="M0,78 C40,43 80,73 120,53 C160,73 200,43 240,63 L300,78"/>
      </g>

      <!-- Bottom wavy edge (slight irregularity — hand-drawn feel) -->
      <path d="M0,100 Q12,97 25,100 T50,100 T75,99 T100,101 T125,100 T150,99 T175,100 T200,101 T225,100 T250,99 T275,100 T300,100 L300,110 L0,110 Z"
            fill="#FBF4E3"/>
    </pattern>
  </defs>
  <rect width="300" height="110" fill="url(#celtic-gold)"/>
</svg>
